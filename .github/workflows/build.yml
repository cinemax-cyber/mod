name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: unzip LegendaryClasses-projet.zip
      - run: mvn -B clean package
        working-directory: LegendaryClasses
      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryClasses
          path: LegendaryClasses/target/LegendaryClasses-*.jar
